name: tests

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # typing-extensions is imported by fast_flights.querying but missing from
      # its declared dependencies (upstream packaging bug) — install explicitly
      - run: pip install 'fast-flights>=3.1,<4' typing-extensions
      - run: python -m unittest discover -s tests -v
